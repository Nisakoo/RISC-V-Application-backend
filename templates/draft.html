{{ define "draft.html" }}
<!doctype html>
<html lang="ru">
{{ template "head" .Layout }}
<body>
  <div class="phone">
    <main class="page-view plain-page">
      <section class="page-content add-page">
        <h1>Добавление инструкции</h1>
        <p class="page-subtitle">Заполните поля, чтобы добавить инструкцию</p>
        <form aria-describedby="draft-mode-note">
          <p class="visually-hidden" id="draft-mode-note">В первой лабораторной данные формы не сохраняются.</p>
          <div class="media-fields">
            <input class="visually-hidden media-input" id="instruction-video" name="instruction_video" type="file" accept="video/mp4,video/quicktime">
            <label class="media-field" for="instruction-video">
              <span class="media-field__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg></span>
              <strong>Видео</strong><small>MP4, MOV · до 500 МБ</small>
            </label>
            <input class="visually-hidden media-input" id="instruction-image" name="instruction_image" type="file" accept="image/png,image/jpeg">
            <label class="media-field" for="instruction-image">
              <span class="media-field__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="15.5" cy="9" r="1.5"/><path d="m6.5 17 4.5-5 3 3 2-2 2.5 4Z"/></svg></span>
              <strong>Изображение</strong><small>PNG, JPG · до 20 МБ</small>
            </label>
          </div>
          <div class="form-field">
            <label class="form-label" for="instruction-mnemonic">Инструкция</label>
            <input class="form-control" id="instruction-mnemonic" name="mnemonic" value="{{ .Instruction.Mnemonic }}">
          </div>
          <div class="form-field">
            <label class="form-label" for="instruction-description">Описание</label>
            <textarea class="form-control" id="instruction-description" name="description" rows="3">{{ .Instruction.Description }}</textarea>
          </div>
          <div class="form-field">
            <label class="form-label" for="instruction-format">Тип инструкции</label>
            <input class="form-control" id="instruction-format" name="format" value="{{ .Instruction.Format }}">
          </div>
          <div class="form-field">
            <label class="form-label" for="instruction-operands">Количество операндов</label>
            <input class="form-control" id="instruction-operands" name="operand_count" type="number" min="0" max="3" value="{{ .Instruction.OperandCount }}">
          </div>
          <div class="form-field">
            <label class="form-label" for="instruction-length">Длина команды, бит</label>
            <input class="form-control" id="instruction-length" name="length_bits" type="number" min="16" max="64" step="16" value="{{ .Instruction.LengthBits }}">
          </div>
        </form>
      </section>
    </main>
    {{ template "navigation" .Layout }}
  </div>
</body>
</html>
{{ end }}
